[pytest]
pythonpath = .
log_level = INFO
log_format = %(asctime)s | %(levelname)s | %(filename)s | %(module)s.%(funcName)s:%(lineno)d | %(message)s
addopts = --html=./Reports/report.html -v -s --self-contained-html
markers =
    API: API tests
    BAT: Browser automation tests
    AUTH: Browser authenticated tests
    DIAL: Dialog handeling test
    TAB: Window handeling tests
asyncio_mode = auto
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session