# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Sanity test

on:
  push:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: "pages"
  cancel-in-progress: false
jobs:
  build:

    runs-on: self-hosted

    steps:
    - uses: actions/checkout@v6
    - name: Set up Python 3.12.3
      uses: actions/setup-python@v5
      with:
        python-version: "3.12.3"
    - name: Install dependencies
      run: |
        python3 -m pip install --upgrade pip
        pip install selenium
        pip install pytest
        pip install pytest-selenium
        pip install pytest-html
        pip install pytest-xdist
        pip install pytest-rerunfailures
        
    - name: Test with pytest and Chrome
      run: |
        python3 -m pytest --html=Reports/chrome/report_ch.html --self-contained-html --browser-type=chromium -n 3 -v -s tests -m "not AUTH"
   
    - name: Test with pytest and Firefox
      run: |
        python3 -m pytest --html=Reports/firefox/report_ff.html --self-contained-html --browser-type=firefox -n 3 -v -s tests -m "not AUTH"
    - name: Upload Test Report
      if: always() # Ensures the report is uploaded even if tests fail
      uses: actions/upload-pages-artifact@v3
      with:
        path: Reports/
  deploy:
    needs: build
    if: always() # Deploy even if some test assertions failed, so you can inspect the report
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      # Step 2: Deploy the uploaded artifact to GitHub Pages
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Add Report Links to Workflow Summary
        if: always()
        run: |
          echo "## 📊 Test Reports" >> $GITHUB_STEP_SUMMARY
          echo "* 🌐 [Chrome Test Report](https://armand2099.github.io/selenium_framework_template/chrome/report_ch.html)" >> $GITHUB_STEP_SUMMARY
          echo "* 🌐 [Firefox Test Report](https://armand2099.github.io/selenium_framework_template/firefox/report_ff.html)" >> $GITHUB_STEP_SUMMARY
